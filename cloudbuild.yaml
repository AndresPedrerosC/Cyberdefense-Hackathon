# gcloud builds submit --config cloudbuild.yaml
# Secret clickhouse-app-password must exist in Secret Manager.
substitutions:
  _REGION: us-central1  # same region as the ClickHouse Cloud service
  _SERVICE: cyberdefense
  _REPO: cyberdefense
  _CH_HOST: m614888n23.us-central1.gcp.clickhouse.cloud

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --memory=512Mi
      - --cpu=1
      - --timeout=300
      - --set-env-vars=CLICKHOUSE_HOST=${_CH_HOST},CLICKHOUSE_PORT=8443,CLICKHOUSE_SECURE=true,CLICKHOUSE_USER=cyberdefense_app,CLICKHOUSE_DATABASE=cyberdefense,DEMO_MODE=true,LLM_ENABLED=false
      - --set-secrets=CLICKHOUSE_PASSWORD=clickhouse-app-password:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
