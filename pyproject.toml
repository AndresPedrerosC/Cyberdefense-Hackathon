[project]
name = "cyberdefense"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "clickhouse-connect>=0.7.0",
    "openai>=1.50.0",
    "semver>=3.0.0",
    "cvss>=3.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"
